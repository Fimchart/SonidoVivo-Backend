#NOMBRE DE LA APLICACION
spring.application.name=msUsuarios

#SERVIDOR: LOCALHOST. PUERTO: 3306. BASE DE DATOS: USUARIOS
#SI NO EXISTE LA BASE DE DATOS, SE CREA AUTOMATICAMENTE
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true

#USUARIO PARA CONECTARSE A MYSQL
spring.datasource.username=root
spring.datasource.password=

#CLASE DEL CONTROLADOR JDBC QUE PERMITE CONECTARSE CON MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / HIBERNATE
#VALIDA QUE LA ESTRUCTURA DE LAS TABLAS COINCIDA CON LAS ENTIDADES
#HIBERNATE NO CREA NI MODIFICA TABLAS, ESA TAREA LA REALIZA FLYWAY
spring.jpa.hibernate.ddl-auto=validate

#MUESTRA EN CONSOLA LAS SENTENCIAS SQL EJECUTADAS POR HIBERNATE
spring.jpa.show-sql=true

#PRESENTA LAS SENTENCIAS SQL CON FORMATO MAS LEGIBLE
spring.jpa.properties.hibernate.format_sql=true

#EL MICROSERVICIO ESTARA DISPONIBLE EN HTTP://LOCALHOST:8081
server.port=8081

#HABILITA LA EJECUCION DE LAS MIGRACIONES PENDIENTES AL INICIAR
spring.flyway.enabled=true

#CORRESPONDE A SRC/MAIN/RESOURCES/DB/MIGRATION
spring.flyway.locations=classpath:db/migration