spring.application.name=msProductos
server.port=8083

# Conexión MySQL (Laragon) - crea la BD 'productos' automáticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# JPA + Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration