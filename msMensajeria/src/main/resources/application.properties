# NOMBRE DE LA APLICACION
spring.application.name=msMensajeria

#SERVIDOR: LOCALHOST. PUERTO: 3306. BASE DE DATOS: MENSAJERIA 
#SI NO EXSISTE LA BASE DE DATOS, SE CREA AUTOMATICAMENTE
spring.datasource.url=jdbc:mysql://localhost:3306/mensajeria?createDatabaseIfNotExist=true

#USUARIO PARA CONECTARSR A MYSQL
spring.datasource.username=root
spring.datasource.password=


#CLASE DEL CONRTROLADOR JDBC QUE PERMITE CONECTARSE CON MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA / HIBERNATE
#VALIDA QUE LA ESTRUCTIRA DE LAS TABLAS COINCIDA CON LAS ENTIDADES
#HIBERNATE NO CRE NI MODIFICA TABLAS, ESA TAREA LA REALIZA FLYWAY
spring.jpa.hibernate.ddl-auto=validate

#MUESTRA LA CONSOLA LAS SENTENCIAS SQL EJECUTADAS POR HIBERNATE
spring.jpa.show-sql=true

#PRESENTA LAS SENTENCIAS SQL CON FORMATO MAS LEGIBLE
spring.jpa.properties.hibernate.format_sql=true


#EL MICROSERVIC¿SIO ESTARA DISPONIBLE EN HTTPS://LOCALHOST:8082
server.port=8082

#HABILITA LA EJECUCION DE LAS MIGRACIONES PENDIENTES AL INICIAR
spring.flyway.enabled=true

#CORRESPONDE A SRC/
spring.flyway.locations=classpath:db/migration